name: Release Windows package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build standalone executable
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # onedir 而非 onefile：onefile 每次啟動都要解壓到暫存並被防毒掃描，約需 30 秒
          pyinstaller --onedir --console --name unlock_pdf unlock_pdf.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item install.bat, uninstall.bat, README.md dist\unlock_pdf\
          Compress-Archive -Path dist\unlock_pdf\* -DestinationPath pdf-unlock-win.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pdf-unlock-win.zip
          fail_on_unmatched_files: true
